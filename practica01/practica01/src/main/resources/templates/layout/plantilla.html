<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <title>[[#{aplicacion.titulo}]]</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    </head>

    <body>
        <header th:fragment="header">
            <nav class="navbar navbar-expand-md navbar-dark bg-success">
                <div class="container">
                    <a class="navbar-brand fw-bold" th:href="@{/suculenta/listado}">
                        <i class="fas fa-seedling"></i> [[#{aplicacion.titulo}]]
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuSuculentas">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="menuSuculentas">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/suculenta/listado}">
                                    <i class="fas fa-list"></i> [[#{plantilla.suculentas}]]
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/suculenta/nuevo}">
                                    <i class="fas fa-plus"></i> [[#{plantilla.nueva}]]
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
            <section class="py-3 bg-light border-bottom">
                <div class="container">
                    <h1 class="h3 mb-0 text-success">
                        <i class="fas fa-leaf"></i> [[#{plantilla.subtitulo}]]
                    </h1>
                </div>
            </section>
        </header>

        <div th:fragment="mensajes" class="container mt-3">
            <div th:if="${todoOk != null}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle"></i> <span th:text="${todoOk}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show">
                <i class="fas fa-triangle-exclamation"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <footer th:fragment="footer" class="py-3 mt-5 bg-success text-white">
            <p class="text-center mb-0">[[#{plantilla.derechos}]] &copy;</p>
        </footer>
    </body>
</html>
